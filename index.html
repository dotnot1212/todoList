<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="گیمیفیکیشن برنامه‌نویسی با رابط کاربری مدرن و بهینه">
  <title>گیمیفیکیشن برنامه‌نویسی</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Header -->
  <header class="gradient-header text-white py-4 shadow-sm sticky-top">
    <div class="container d-flex justify-content-between align-items-center flex-wrap">
      <h1 class="h3 mb-0 logo-title">🎮 گیمیفیکیشن برنامه‌نویسی</h1>
      <div class="d-flex align-items-center gap-3">
        <div id="total-score" class="badge bg-success fs-5 p-3 rounded-pill">امتیاز کل: 0</div>
        <button id="darkToggle" class="btn btn-outline-light btn-sm">🌓 تغییر تم</button>
      </div>
    </div>
  </header>

  <!-- Main -->
  <div class="container my-4">
    <div class="row">

      <!-- Sidebar (Rewards + Timer) -->
      <aside class="col-lg-4 mb-4">
        <div class="card shadow-sm">
          <div class="card-header bg-success text-white fw-bold">🎁 جایزه‌ها</div>
          <div class="card-body" id="rewards"></div>
        </div>
        <div class="card shadow-sm mt-4">
          <div class="card-header bg-info text-white fw-bold">⏱️ تایمر تمرکز</div>
          <div class="card-body text-center">
            <h4 id="timer-display">25:00</h4>
            <div class="btn-group mt-2">
              <button class="btn btn-outline-primary btn-sm" id="start-timer">شروع</button>
              <button class="btn btn-outline-secondary btn-sm" id="reset-timer">ریست</button>
            </div>
          </div>
        </div>
      </aside>

      <!-- Tasks + Progress -->
      <main class="col-lg-8">
        <h2 class="fs-4 text-primary fw-bold mb-3">📋 کارها</h2>
        <div id="loading" class="text-center text-muted">در حال بارگذاری...</div>
        <div id="tasks"></div>
        <div class="progress-container mt-4">
          <label class="form-label">پیشرفت:</label>
          <div class="progress">
            <div id="progress-bar" class="progress-bar bg-success" role="progressbar" style="width: 0%">0%</div>
          </div>
        </div>
        <!-- بخش تاریخچه پیشرفت -->
        <div class="card shadow-sm mt-4">
          <div class="card-header bg-warning text-dark fw-bold">📈 تاریخچه پیشرفت</div>
          <div class="card-body" id="progress-history"></div>
        </div>
      </main>

    </div>
  </div>

  <!-- Footer -->
  <footer class="gradient-footer text-white py-3 mt-5">
    <div class="container text-center">
      <small class="footer-text">ساخته شده با ❤️ توسط <span class="fw-bold">رضا</span> | نسخه ۱.۰</small>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios@1.6.2/dist/axios.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
